kind = "web"
previewPath = "/"
title = "AEO Chatbot"
version = "1.0.0"
id = "artifacts/aeo-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26224

[services.development]
run = "pnpm --filter @workspace/aeo-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aeo-chat", "run", "build" ]
publicDir = "artifacts/aeo-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26224"
BASE_PATH = "/"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AEO Chatbot API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: dashboard
    description: AEO analytics and dashboard operations
  - name: backend-logs
    description: Backend activity and LLM call logs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get high-level AEO dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent conversation activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/daily-volume:
    get:
      operationId: getDailyVolume
      tags: [dashboard]
      summary: Get message volume grouped by day (last 14 days)
      responses:
        "200":
          description: Daily volume data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyVolume"

  /backend-logs:
    get:
      operationId: listBackendLogs
      tags: [backend-logs]
      summary: List recent backend LLM call logs
      responses:
        "200":
          description: Backend activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackendLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messageCount:
          type: integer
      required:
        - id
        - title
        - createdAt
        - messageCount

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        tokensUsed:
          type: ["integer", "null"]
        responseTimeMs:
          type: ["integer", "null"]
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
        - tokensUsed
        - responseTimeMs

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messageCount
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardStats:
      type: object
      properties:
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        avgResponseTimeMs:
          type: ["number", "null"]
        totalTokensUsed:
          type: integer
        conversationsToday:
          type: integer
        messagesLast7Days:
          type: integer
      required:
        - totalConversations
        - totalMessages
        - avgResponseTimeMs
        - totalTokensUsed
        - conversationsToday
        - messagesLast7Days

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        conversationTitle:
          type: string
        lastMessage:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - conversationTitle
        - lastMessage
        - role
        - createdAt

    DailyVolume:
      type: object
      properties:
        date:
          type: string
        messageCount:
          type: integer
        conversationCount:
          type: integer
      required:
        - date
        - messageCount
        - conversationCount

    BackendLog:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
        event:
          type: string
        model:
          type: string
        conversationId:
          type: ["integer", "null"]
        tokensUsed:
          type: ["integer", "null"]
        responseTimeMs:
          type: ["integer", "null"]
        status:
          type: string
        details:
          type: ["string", "null"]
      required:
        - id
        - timestamp
        - event
        - model
        - conversationId
        - tokensUsed
        - responseTimeMs
        - status
        - details
